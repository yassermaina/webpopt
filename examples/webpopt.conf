# Example project preferences for webpopt.
# Copy to the root of your project as ".webpopt.conf".
# Plain "key = value" lines; the file is parsed, never executed.
# Command-line options override these values.

quality = 80        # 0-100
effort = 6          # 0-6, 6 = smallest output, slowest
max_width = 1920    # shrink wider images to this width; 0 = no limit
max_height = 0      # shrink taller images to this height; 0 = no limit
lossless = false    # true for flat-color PNG artwork
metadata = icc      # none | icc | all
min_savings = 0     # keep the WebP only if at least this % smaller
recursive = false   # recurse into sub-directories by default
